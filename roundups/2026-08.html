<style>
  /* ---- The desk the page sits on: follows the viewer's theme ---- */
  :root{
    --desk:#E7E3DA; --desk-edge:#D2CCBF; --chrome-ink:#4A4740; --chrome-dim:#7C776C;
    --btn-bg:#FBFAF7; --btn-line:#C6BFB0;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --desk:#23252A; --desk-edge:#171920; --chrome-ink:#CBC7BC;
      --chrome-dim:#8B877D; --btn-bg:#2E3138; --btn-line:#454951; }
  }
  :root[data-theme="dark"]{ --desk:#23252A; --desk-edge:#171920; --chrome-ink:#CBC7BC;
    --chrome-dim:#8B877D; --btn-bg:#2E3138; --btn-line:#454951; }

  /* ---- The paper itself: one committed world, identical in every theme ---- */
  :root{
    --paper:#F8F5EC;        /* ivory journal stock          */
    --dot:#CFC6B0;          /* the dot grid                 */
    --ink:#28323B;          /* dark blue-black fountain pen */
    --ink-soft:#6B7680;     /* the same pen, lighter hand   */
    --ink-faint:#A6ADB2;
    --teal:#2F6F6B;         /* pen no.2                     */
    --marigold:#D9A441;     /* the highlighter              */
    --clay:#B0564A;         /* used exactly twice           */
    --olive:#77854F;        /* spine colours 5 and 6, so up */
    --slate:#57738F;        /* to six books stay tellable   */
  }

  body{ background:var(--desk); color:var(--chrome-ink);
        font-family:"Courier Prime", ui-monospace, monospace;
        display:flex; flex-direction:column; align-items:center;
        padding-block:20px 40px; padding-left:16px; padding-right:16px; }

  /* ---------- screen-only chrome ---------- */
  .chrome{ width:100%; max-width:720px; display:flex; align-items:baseline;
           justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .chrome h1{ margin:0; font-family:"Caveat",cursive; font-weight:600; font-size:22px;
              letter-spacing:.01em; color:var(--chrome-ink); }
  .chrome .hint{ font-size:11px; color:var(--chrome-dim); letter-spacing:.02em; }
  .print-btn{ font-family:"Courier Prime",monospace; font-size:11px; font-weight:700;
              text-transform:uppercase; letter-spacing:.12em; color:var(--chrome-ink);
              background:var(--btn-bg); border:1px solid var(--btn-line); border-radius:2px;
              padding:7px 14px; cursor:pointer; }
  .print-btn:hover{ border-color:var(--chrome-dim); }
  .print-btn:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }

  .stage-wrap{ width:100%; display:flex; justify-content:center; }
  .stage{ transform-origin:top center; }

  /* ---------- the page: 5in x 7in ---------- */
  @page{ size:5in 7in; margin:0; }
  .page{
    width:480px; height:672px;            /* 5in x 7in at 96dpi */
    box-sizing:border-box; padding:26px 26px 20px;
    background:var(--paper); color:var(--ink);
    background-image:radial-gradient(var(--dot) 0.7px, transparent 0.8px);
    background-size:11.34px 11.34px;      /* a true 3mm dot grid */
    background-position:8px 8px;
    box-shadow:0 1px 2px rgba(0,0,0,.14), 0 10px 30px rgba(0,0,0,.18);
    display:flex; flex-direction:column; gap:9px; overflow:hidden; position:relative;
  }
  /* the UA's own margins on blockquote/figure would indent the quote and
     unbalance the photo columns — clear them before anything else */
  .page blockquote, .page figure, .page figcaption, .page p, .page h1{ margin:0; }

  /* ---------- masthead ---------- */
  /* hand-lettered banner caps between rules, the way a journal header is drawn */
  .masthead{ display:flex; flex-direction:column; gap:3px; }
  .masthead .hair{ height:1px; background:var(--ink); opacity:.8; }
  .masthead .dbl{ height:3px; border-top:1px solid var(--ink); border-bottom:1px solid var(--ink); }
  .masthead .title{ font-family:"Caveat",cursive; font-weight:700; font-size:30px;
                    line-height:1.04; text-align:center; text-transform:uppercase;
                    letter-spacing:.085em; color:var(--ink); text-wrap:balance;
                    padding-left:.085em; }

  /* ---------- sections ---------- */
  .sec{ display:flex; flex-direction:column; gap:5px; }
  .sec-head{ display:flex; align-items:center; gap:6px; }
  .sec-head svg{ flex:none; }
  .sec-head .name{ font-size:8.5px; font-weight:700; text-transform:uppercase;
                   letter-spacing:.2em; color:var(--ink); }
  .sec-head .rule{ flex:1; height:1px; background:var(--ink-faint); opacity:.55; }

  /* ---------- reading ---------- */
  .read-top{ display:flex; align-items:center; gap:17px; }
  .spines{ flex:none; }
  .stat{ display:flex; align-items:baseline; gap:4px; }
  .stat .n{ font-family:"Caveat",cursive; font-weight:700; font-size:31px; line-height:1;
            color:var(--ink); font-variant-numeric:tabular-nums; }
  .stat .n.alt{ color:var(--teal); }
  .stat .u{ font-size:7.5px; text-transform:uppercase; letter-spacing:.14em; color:var(--ink-soft); }

  .scores{ display:flex; gap:20px; align-items:center; }
  .score{ display:flex; align-items:center; gap:5px; }
  .score .who{ font-size:7px; text-transform:uppercase; letter-spacing:.13em; color:var(--ink-soft); }
  .score .val{ font-family:"Caveat",cursive; font-size:16px; font-weight:700; line-height:1;
               font-variant-numeric:tabular-nums; }

  .picks{ display:flex; flex-direction:column; gap:3px; }
  .pick{ display:flex; gap:5px; align-items:flex-start; font-family:"Crimson Pro",Georgia,serif;
         font-size:9.5px; line-height:1.34; }
  .pick .mk{ flex:none; font-family:"Courier Prime",monospace; font-size:9px; font-weight:700;
             line-height:1.42; width:9px; text-align:center; }
  .pick b{ font-weight:600; }
  .pick i{ color:var(--ink-soft); font-style:italic; }

  .quote{ position:relative; border-left:2px solid var(--marigold); padding:2px 4px 2px 8px;
          font-family:"Crimson Pro",Georgia,serif; font-style:italic; font-size:11px;
          line-height:1.32; color:var(--ink); }
  .quote cite{ display:block; font-style:normal; font-family:"Courier Prime",monospace;
               font-size:7px; letter-spacing:.13em; text-transform:uppercase;
               color:var(--ink-soft); margin-top:2px; }

  /* ---------- health ---------- */
  .steps-row{ display:flex; align-items:center; gap:9px; }
  .steps-row .n{ font-family:"Caveat",cursive; font-weight:700; font-size:28px; line-height:1;
                 color:var(--ink); font-variant-numeric:tabular-nums; }
  .steps-row .u{ font-size:7px; text-transform:uppercase; letter-spacing:.14em;
                 color:var(--ink-soft); }
  .equiv{ font-family:"Caveat",cursive; font-size:14px; color:var(--teal); line-height:1.1; }
  .h-grid{ display:grid; grid-template-columns:1.15fr 1fr; gap:8px 14px; align-items:start; }
  .hstat{ display:flex; flex-direction:column; gap:3px; }
  .hstat .top{ display:flex; align-items:baseline; gap:4px; }
  .hstat .n{ font-family:"Caveat",cursive; font-weight:700; font-size:19px; line-height:1;
             font-variant-numeric:tabular-nums; }
  .hstat .u{ font-size:7px; text-transform:uppercase; letter-spacing:.13em; color:var(--ink-soft); }
  /* 16 to a row, so 28-31 nights always land as two tidy rows and never
     orphan a single dot onto a third */
  .nights{ display:grid; grid-template-columns:repeat(16, 5.4px); gap:2.6px;
           width:max-content; }
  .nights i{ width:5.4px; height:5.4px; border-radius:50%; display:block;
             border:1px solid var(--teal); }
  .nights i.on{ background:var(--teal); }

  /* ---------- bottom row ---------- */
  /* the bottom row takes whatever height is left, and the photos absorb it —
     a quiet month grows the pictures instead of leaving a hole */
  .bottom{ display:grid; grid-template-columns:1.25fr 1fr; gap:14px; flex:1; min-height:0; }
  .col{ display:flex; flex-direction:column; gap:5px; min-width:0; min-height:0; }

  .photos{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px;
           align-items:stretch; margin-top:2px; flex:1 1 auto; min-height:124px; }
  .polaroid{ position:relative; background:#FFFDF8; padding:3.5px 3.5px 0;
             box-shadow:0 1px 2px rgba(40,50,59,.2);
             display:flex; flex-direction:column; min-height:0; }
  .polaroid:nth-child(1){ transform:rotate(-1.7deg); }
  .polaroid:nth-child(2){ transform:rotate(1.4deg); }
  .polaroid::before{ content:""; position:absolute; top:-5px; left:50%; width:34px; height:11px;
                     transform:translateX(-50%) rotate(-3deg);
                     background:rgba(217,164,65,.42); border-left:1px solid rgba(217,164,65,.6);
                     border-right:1px solid rgba(217,164,65,.6); }
  .polaroid .frame{ width:100%; max-width:100%; display:block; flex:1 1 auto; min-height:0;
                    object-fit:cover; background:#EDE8DC; }
  .polaroid figcaption{ flex:none; font-family:"Caveat",cursive; font-size:11px; line-height:1.14;
                        text-align:center; color:var(--ink); padding:3px 2px 5px;
                        min-height:15px; overflow:hidden; }
  .noshot{ width:100%; flex:1 1 auto; min-height:0; display:flex; align-items:center;
           justify-content:center; border:1px dashed var(--ink-faint); background:transparent; }

  .fline{ font-family:"Crimson Pro",Georgia,serif; font-size:9.5px; line-height:1.34; }
  .fline .lab{ font-family:"Courier Prime",monospace; font-size:6.8px; font-weight:700;
               text-transform:uppercase; letter-spacing:.15em; color:var(--teal);
               display:block; margin-bottom:1px; }
  .celebrate{ display:flex; gap:5px; align-items:flex-start; margin-top:3px;
              border-top:1px dashed var(--ink-faint); padding-top:5px; }
  .celebrate .txt{ font-family:"Caveat",cursive; font-size:13px; line-height:1.2; color:var(--clay); }

  .wentry{ display:flex; gap:6px; align-items:flex-start; }
  .wentry .bullet{ flex:none; font-family:"Courier Prime",monospace; font-size:11px;
                   font-weight:700; line-height:1.22; width:10px; text-align:center; }
  .wentry .body{ font-family:"Crimson Pro",Georgia,serif; font-size:9.5px; line-height:1.34; }
  .wentry .body .lab{ font-family:"Courier Prime",monospace; font-size:6.8px; font-weight:700;
                      text-transform:uppercase; letter-spacing:.15em; color:var(--teal);
                      display:block; margin-bottom:1px; }
  /* the shelf: every book of the month, best first. The colour chip is the
     same colour as that book's spine in the graphic above, which turns the
     spine drawing into a legend rather than decoration. */
  .shelf{ margin-top:8px; border-top:1px dashed var(--ink-faint); padding-top:5px;
          display:flex; flex-direction:column; gap:2.5px; }
  .shelf-head{ font-size:6.8px; font-weight:700; text-transform:uppercase;
               letter-spacing:.15em; color:var(--teal); margin-bottom:1px; }
  .srow{ display:flex; align-items:center; gap:5px; }
  .srow i{ width:4.5px; height:9.5px; border-radius:1px; flex:none; opacity:.9; }
  .srow .st{ flex:1; min-width:0; font-family:"Crimson Pro",Georgia,serif; font-size:8.7px;
             line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
             color:var(--ink); }
  .srow .ss{ flex:none; font-family:"Caveat",cursive; font-weight:700; font-size:12.5px;
             line-height:1; color:var(--marigold); font-variant-numeric:tabular-nums; }

  /* weather: one band, only drawn when the month carries weather data */
  .weather{ display:flex; flex-direction:column; gap:2.5px;
            border-top:1px dashed var(--ink-faint); border-bottom:1px dashed var(--ink-faint);
            padding:4px 0; }
  .wrow{ display:flex; align-items:center; gap:11px; flex-wrap:wrap; }
  .wnote{ display:flex; align-items:center; gap:5px; font-family:"Crimson Pro",Georgia,serif;
          font-style:italic; font-size:8.8px; line-height:1.25; color:var(--ink-soft); }
  .wnote svg{ flex:none; }
  .weather .wlab{ font-size:6.8px; font-weight:700; text-transform:uppercase;
                  letter-spacing:.18em; color:var(--teal); flex:none; }
  .witem{ display:flex; align-items:center; gap:4px; font-family:"Crimson Pro",Georgia,serif;
          font-size:8.8px; color:var(--ink-soft); }
  .witem b{ font-family:"Caveat",cursive; font-size:14px; font-weight:700; color:var(--ink);
            line-height:1; font-variant-numeric:tabular-nums; }
  .witem b.warm{ color:var(--clay); }
  .witem b.wet{ color:var(--teal); }

  /* the page's own footer: absorbs whatever vertical slack the month leaves */
  .foot{ margin-top:auto; border-top:1px dashed var(--ink-faint); padding-top:5px;
         display:flex; justify-content:space-between; align-items:baseline; gap:10px;
         font-size:6.8px; color:var(--ink-soft); letter-spacing:.1em; }
  .foot b{ color:var(--ink); font-weight:700; }
  .foot .stamp{ text-transform:uppercase; letter-spacing:.22em; color:var(--ink-faint); }

  .sample-note{ position:absolute; right:-2px; top:196px; transform:rotate(90deg);
                transform-origin:right top; font-family:"Caveat",cursive; font-size:11px;
                color:var(--clay); opacity:.85; white-space:nowrap; }

  /* ---------- print ---------- */
  @media print{
    body{ background:#fff; padding:0; display:block; }
    .chrome, .sample-note{ display:none !important; }
    .stage{ transform:none !important; }
    .stage-wrap{ display:block; }
    .page{ box-shadow:none; margin:0; }
  }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>

<div class="chrome">
  <div>
    <h1 id="chrome-title">Monthly Roundup</h1>
    <div class="hint">5 &times; 7 in &middot; print at actual size, trim, paste in</div>
  </div>
  <button class="print-btn" id="print-btn" type="button">Print</button>
</div>

<div class="stage-wrap" id="stage-wrap">
  <div class="stage" id="stage">
    <div class="page" id="page"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const num = n => Number(n || 0).toLocaleString("en-US");

  /* ---- derived reading numbers: computed here, never hand-entered ---- */
  const books      = (DATA.reading && DATA.reading.books) || [];
  const nBooks     = books.length;
  const totalPages = books.reduce((s,b) => s + (Number(b.pages) || 0), 0);
  const avg = (key) => {
    const v = books.map(b => Number(b[key])).filter(n => !isNaN(n) && n > 0);
    return v.length ? v.reduce((a,b) => a+b, 0) / v.length : 0;
  };
  const avgGR   = avg("goodreads");
  const avgMine = avg("mine");

  /* ---- small hand-drawn parts ---- */
  const STAR = "6,1 7.29,4.42 10.95,4.59 8.09,6.88 9.06,10.41 6,8.4 2.94,10.41 3.91,6.88 1.05,4.59 4.71,4.42";
  let uid = 0;
  function stars(rating, color){
    const id = "clip" + (++uid);
    const w  = Math.max(0, Math.min(5, rating)) / 5 * 62;
    const row = [0,1,2,3,4].map(i =>
      `<polygon points="${STAR}" transform="translate(${i*12.5},0)"/>`).join("");
    return `<svg viewBox="0 0 62 12" width="62" height="12" role="img" aria-label="${rating.toFixed(2)} of 5">
      <defs><clipPath id="${id}"><rect x="0" y="0" width="${w.toFixed(2)}" height="12"/></clipPath>
      <g id="g${id}">${row}</g></defs>
      <use href="#g${id}" fill="none" stroke="${color}" stroke-width="0.9" opacity="0.55"/>
      <use href="#g${id}" fill="${color}" clip-path="url(#${id})"/>
    </svg>`;
  }
  /* a shelf of spines, one per book, height tracking its page count */
  /* one palette, shared by the spine drawing and the shelf list below it, so a
     book's chip and its spine are always the same colour */
  const PAL = ["var(--ink)","var(--teal)","var(--marigold)","var(--clay)",
               "var(--olive)","var(--slate)"];
  function spines(list){
    const pal = PAL;
    const maxP = Math.max(120, ...list.map(b => Number(b.pages) || 0));
    const W = 8, G = 2.6, H = 36;
    const w = Math.max(W, list.length * (W+G) - G);
    const body = list.map((b,i) => {
      const h = 17 + Math.round((Math.min(maxP, Number(b.pages)||0) / maxP) * 17);
      const x = i * (W+G), y = H - h, c = pal[i % pal.length];
      return `<g><rect x="${x}" y="${y}" width="${W}" height="${h}" rx="1" fill="${c}" opacity="0.9"/>
        <rect x="${x+1.6}" y="${y+3.2}" width="${W-3.2}" height="0.9" fill="var(--paper)" opacity="0.75"/>
        <rect x="${x+1.6}" y="${y+5.6}" width="${W-3.2}" height="0.9" fill="var(--paper)" opacity="0.55"/>
        <rect x="${x+1.6}" y="${y+h-4}" width="${W-3.2}" height="0.9" fill="var(--paper)" opacity="0.6"/></g>`;
    }).join("");
    return `<svg class="spines" viewBox="0 0 ${w} ${H}" width="${w}" height="${H}" aria-hidden="true">
      ${body}<line x1="0" y1="${H-0.4}" x2="${w}" y2="${H-0.4}" stroke="var(--ink)" stroke-width="0.9"/></svg>`;
  }
  /* tally marks, five to a gate */
  function tally(n){
    const gates = Math.floor(n/5), rest = n % 5, GW = 15;
    const w = Math.max(GW, gates*GW + (rest ? rest*3 + 4 : 0));
    let out = "", x = 0;
    for (let g=0; g<gates; g++){
      for (let i=0;i<4;i++) out += `<line x1="${x+i*3}" y1="1" x2="${x+i*3}" y2="12"/>`;
      out += `<line x1="${x-1}" y1="12" x2="${x+10}" y2="1"/>`;
      x += GW;
    }
    for (let i=0;i<rest;i++) out += `<line x1="${x+i*3}" y1="1" x2="${x+i*3}" y2="12"/>`;
    return `<svg viewBox="0 0 ${w} 13" width="${w}" height="13" aria-hidden="true"
      stroke="var(--ink)" stroke-width="1.05" stroke-linecap="round">${out}</svg>`;
  }
  /* a walked trail with a bootprint at the end */
  const trail = `<svg viewBox="0 0 96 18" width="96" height="18" aria-hidden="true" fill="none">
      <path d="M1,13 C14,3 26,17 39,9 C52,1 62,15 74,9" stroke="var(--ink-faint)"
            stroke-width="1.1" stroke-linecap="round" stroke-dasharray="1.5 3.6"/>
      <g fill="var(--teal)" opacity="0.85">
        <ellipse cx="82" cy="8.4" rx="2.5" ry="4.2" transform="rotate(14 82 8.4)"/>
        <ellipse cx="88.5" cy="12" rx="2.5" ry="4.2" transform="rotate(14 88.5 12)"/>
      </g></svg>`;

  const ICON = {
    book:`<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="var(--teal)"
      stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4.2C6.6 3 4.6 2.6 2.4 2.8v9.4c2.2-.2 4.2.2 5.6 1.4 1.4-1.2 3.4-1.6 5.6-1.4V2.8C11.4 2.6 9.4 3 8 4.2z"/><path d="M8 4.2v9.4"/></svg>`,
    shoe:`<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="var(--teal)"
      stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 11.6V5.2l2.6.8 1.6 2 3 .9 4.4 1.5c.9.3 1.2 1.2.5 1.7-.5.4-1.3.5-2 .5H3.2c-.7 0-1.2-.4-1.2-1z"/><path d="M4.6 6 6 4.4"/></svg>`,
    house:`<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="var(--teal)"
      stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 7.4 8 2.6l5.8 4.8"/><path d="M3.6 8.5v4.9h8.8V8.5"/><path d="M6.6 13.4v-3.2h2.8v3.2"/></svg>`,
    case:`<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="var(--teal)"
      stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5.2" width="12" height="8.2" rx="1.2"/><path d="M6 5.2V3.9c0-.5.4-.9.9-.9h2.2c.5 0 .9.4.9.9v1.3"/><path d="M2 8.8h12"/></svg>`,
    star:`<svg viewBox="0 0 14 14" width="12" height="12" aria-hidden="true"><polygon points="7,1.2 8.6,5.1 12.8,5.4 9.6,8.1 10.6,12.2 7,9.9 3.4,12.2 4.4,8.1 1.2,5.4 5.4,5.1" fill="var(--clay)" opacity="0.9"/></svg>`
  };
  function photo(src, caption, alt){
    const inner = src
      ? `<img class="frame" src="${esc(src)}" alt="${esc(alt)}">`
      : `<div class="noshot" role="img" aria-label="no photo"><svg viewBox="0 0 24 24" width="19" height="19"
           fill="none" stroke="var(--ink-faint)" stroke-width="1.3" stroke-linecap="round"
           stroke-linejoin="round"><path d="M3 8.5h3.4L8 6.3h8l1.6 2.2H21v10H3z"/><circle cx="12" cy="13.2" r="3.1"/></svg></div>`;
    return `<figure class="polaroid">${inner}<figcaption>${esc(caption || "")}</figcaption></figure>`;
  }

  /* ---- compose the page ---- */
  const r = DATA.reading || {}, h = DATA.health || {},
        f = DATA.family  || {}, w = DATA.work   || {};
  const days   = Number(DATA.daysInMonth) || 30;
  const nights = Math.max(0, Math.min(days, Number(h.nightsOver6) || 0));
  const dots   = Array.from({length: days}, (_,i) =>
    `<i class="${i < nights ? "on" : ""}"></i>`).join("");

  /* the shelf, best-rated first, each chip keyed to that book's spine colour */
  const score = v => Number.isInteger(v) ? String(v) : Number(v).toFixed(2).replace(/0$/, "");
  const shelfRows = books
    .map((b, i) => ({ title: b.title, mine: Number(b.mine) || 0, color: PAL[i % PAL.length] }))
    .filter(b => b.title)
    .sort((a, b) => b.mine - a.mine)
    .map(b => `<div class="srow"><i style="background:${b.color}"></i>
      <span class="st">${esc(b.title)}</span>
      <span class="ss">${b.mine > 0 ? score(b.mine) : "&ndash;"}</span></div>`)
    .join("");

  /* weather is optional: no data, no band. Each month names its own figures,
     since what's worth reporting differs — a dry month and a cold one are not
     interesting for the same reasons. */
  const wx = DATA.weather;
  const BOLT = `<svg viewBox="0 0 12 16" width="8.5" height="11.5" aria-hidden="true">
      <path d="M7.6 0.9 2.3 9.1h3.1l-1 6 5.4-8.7H6.7z" fill="var(--marigold)"
            stroke="var(--ink)" stroke-width=".7" stroke-linejoin="round"/></svg>`;
  const weatherBand = !(wx && wx.items && wx.items.length) ? "" : `
    <div class="weather">
      <div class="wrow">
        <span class="wlab">${esc(wx.place || "Weather")}</span>
        ${wx.items.map(it => `<span class="witem"><b class="${
          it.tone === "warm" ? "warm" : it.tone === "wet" ? "wet" : ""
        }">${esc(it.value)}</b> ${esc(it.label)}</span>`).join("")}
      </div>
      ${wx.note ? `<div class="wnote">${BOLT}<span>${esc(wx.note)}</span></div>` : ""}
    </div>`;

  const head = (icon, name) =>
    `<div class="sec-head">${icon}<span class="name">${name}</span><span class="rule"></span></div>`;

  document.getElementById("page").innerHTML = `
    ${DATA.sample ? `<div class="sample-note">sample month — yours will be real</div>` : ""}

    <div class="masthead">
      <div class="hair"></div>
      <h1 class="title">${esc(DATA.month)} ${esc(DATA.year)} Roundup</h1>
      <div class="dbl"></div>
    </div>

    <section class="sec">
      ${head(ICON.book, "Reading")}
      <div class="read-top">
        ${spines(books)}
        <span class="stat"><span class="n">${nBooks}</span><span class="u">${nBooks === 1 ? "book" : "books"}</span></span>
        <span class="stat"><span class="n alt">${num(totalPages)}</span><span class="u">pages</span></span>
      </div>
      <div class="scores">
        <span class="score"><span class="who">Mine</span>${stars(avgMine,"var(--marigold)")}<span class="val" style="color:var(--marigold)">${avgMine.toFixed(2)}</span></span>
        <span class="score"><span class="who">Goodreads</span>${stars(avgGR,"var(--ink-soft)")}<span class="val" style="color:var(--ink-soft)">${avgGR.toFixed(2)}</span></span>
      </div>
      <div class="picks">
        <div class="pick"><span class="mk" style="color:var(--clay)">&#9829;</span>
          <span><b>${esc((r.favorite||{}).title)}</b>${(r.favorite||{}).note ? ` &mdash; <i>${esc(r.favorite.note)}</i>` : ""}</span></div>
        <div class="pick"><span class="mk" style="color:var(--ink-faint)">&times;</span>
          <span><b>${esc((r.leastFavorite||{}).title)}</b>${(r.leastFavorite||{}).note ? ` &mdash; <i>${esc(r.leastFavorite.note)}</i>` : ""}</span></div>
      </div>
      ${(r.quote && r.quote.text) ? `<blockquote class="quote">&ldquo;${esc(r.quote.text)}&rdquo;
        <cite>${esc(r.quote.book)}</cite></blockquote>` : ""}
    </section>

    <section class="sec">
      ${head(ICON.shoe, "Health")}
      <div class="steps-row">
        ${trail}
        <div>
          <div style="display:flex;align-items:baseline;gap:4px">
            <span class="n">${num(h.steps)}</span><span class="u">steps</span>
          </div>
          <div class="equiv">&#8776; ${esc(h.stepsEquivalent)}</div>
        </div>
      </div>
      <div class="h-grid">
        <div class="hstat">
          <div class="top"><span class="n" style="color:var(--teal)">${nights}</span>
            <span class="u">nights over 6 hrs &middot; of ${days}</span></div>
          <div class="nights" role="img" aria-label="${nights} of ${days} nights over six hours">${dots}</div>
        </div>
        <div class="hstat" style="gap:7px">
          <div class="top"><span class="n">${num(h.hoursSlept)}</span><span class="u">hours slept</span></div>
          <div class="top" style="gap:6px"><span class="n" style="color:var(--ink)">${num(h.gymWorkouts)}</span>
            <span class="u">workouts</span>${tally(Number(h.gymWorkouts)||0)}</div>
        </div>
      </div>
    </section>

    ${weatherBand}

    <div class="bottom">
      <section class="sec col">
        ${head(ICON.house, "Family")}
        <div class="photos">
          ${photo((f.lilahPhoto||{}).src, (f.lilahPhoto||{}).caption, "Favourite photo of Lilah this month")}
          ${photo((f.activityPhoto||{}).src, (f.activity||{}).caption, "Favourite family activity this month")}
        </div>
        <div class="fline"><span class="lab">New this month</span>${esc(f.lilahSkill)}</div>
        <div class="fline"><span class="lab">Best day out</span>${esc((f.activity||{}).title)}</div>
        ${f.celebration ? `<div class="celebrate">${ICON.star}<span class="txt">${esc(f.celebration)}</span></div>` : ""}
      </section>

      <section class="sec col">
        ${head(ICON.case, "Work")}
        <div class="wentry"><span class="bullet" style="color:var(--teal)">&times;</span>
          <span class="body"><span class="lab">Landed it</span>${esc(w.accomplishment)}</span></div>
        <div class="wentry"><span class="bullet" style="color:var(--clay)">&gt;</span>
          <span class="body"><span class="lab">Migrates forward</span>${esc(w.carryover)}</span></div>
        ${shelfRows ? `<div class="shelf"><div class="shelf-head">The shelf</div>${shelfRows}</div>` : ""}
      </section>
    </div>

    <div class="foot">
      <span><b>&times;</b> done &nbsp;&nbsp; <b>&gt;</b> carried to next month</span>
      <span class="stamp">${esc(DATA.month)} ${esc(DATA.year)}</span>
    </div>
  `;

  const title = `${DATA.month} ${DATA.year} Roundup`;
  document.title = title;
  document.getElementById("chrome-title").textContent = title;

  /* fit the fixed 5x7 page to whatever is looking at it */
  const stage = document.getElementById("stage"), wrap = document.getElementById("stage-wrap");
  function fit(){
    const s = Math.max(0.42, Math.min(1.5, (wrap.clientWidth) / 480));
    stage.style.transform = "scale(" + s + ")";
    wrap.style.height = Math.ceil(672 * s) + "px";
  }
  fit();
  addEventListener("resize", fit);
  document.getElementById("print-btn").addEventListener("click", () => window.print());
})();
</script>
