<style>
  /* ---- The desk the page sits on: follows the viewer's theme ---- */
  :root{
    --desk:#E7E3DA; --desk-edge:#D2CCBF; --chrome-ink:#4A4740; --chrome-dim:#7C776C;
    --btn-bg:#FBFAF7; --btn-line:#C6BFB0;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --desk:#23252A; --desk-edge:#171920; --chrome-ink:#CBC7BC;
      --chrome-dim:#8B877D; --btn-bg:#2E3138; --btn-line:#454951; }
  }
  :root[data-theme="dark"]{ --desk:#23252A; --desk-edge:#171920; --chrome-ink:#CBC7BC;
    --chrome-dim:#8B877D; --btn-bg:#2E3138; --btn-line:#454951; }

  /* ---- The paper itself: one committed world, identical in every theme ---- */
  :root{
    --paper:#F8F5EC;        /* ivory journal stock          */
    --dot:#CFC6B0;          /* the dot grid                 */
    --ink:#28323B;          /* dark blue-black fountain pen */
    --ink-soft:#6B7680;     /* the same pen, lighter hand   */
    --ink-faint:#A6ADB2;
    --teal:#2F6F6B;         /* pen no.2                     */
    --marigold:#D9A441;     /* the highlighter              */
    --clay:#B0564A;         /* used exactly twice           */
    /* Book spines and their shelf chips are a colour-only legend, so this set
       is validated for colour-vision separation rather than picked by eye
       (the previous olive/clay pair sat at deltaE 2.5 under deuteranopia —
       indistinguishable). Structural accents above are unchanged. */
    --cat1:#008F82; --cat2:#E0A72B; --cat3:#BE4A3C;
    --cat4:#44589E; --cat5:#6E8B2E; --cat6:#93407F;
    --purple:#6B3FA0;       /* for annotations beside clay; validated apart */
  }

  body{ background:var(--desk); color:var(--chrome-ink);
        font-family:"Courier Prime", ui-monospace, monospace;
        display:flex; flex-direction:column; align-items:center;
        padding-block:20px 40px; padding-left:16px; padding-right:16px; }

  /* ---------- screen-only chrome ---------- */
  .chrome{ width:100%; max-width:720px; display:flex; align-items:baseline;
           justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .chrome h1{ margin:0; font-family:"Caveat",cursive; font-weight:600; font-size:22px;
              letter-spacing:.01em; color:var(--chrome-ink); }
  .chrome .hint{ font-size:11px; color:var(--chrome-dim); letter-spacing:.02em; }
  .print-btn{ font-family:"Courier Prime",monospace; font-size:11px; font-weight:700;
              text-transform:uppercase; letter-spacing:.12em; color:var(--chrome-ink);
              background:var(--btn-bg); border:1px solid var(--btn-line); border-radius:2px;
              padding:7px 14px; cursor:pointer; }
  .print-btn:hover{ border-color:var(--chrome-dim); }
  .print-btn:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }

  .stage-wrap{ width:100%; display:flex; justify-content:center; }
  .stage{ transform-origin:top center; }

  /* ---------- the page: 5in x 7in ---------- */
  @page{ size:5in 7in; margin:0; }
  .page{
    width:480px; height:672px;            /* 5in x 7in at 96dpi */
    box-sizing:border-box; padding:26px 26px 20px;
    background:var(--paper); color:var(--ink);
    background-image:radial-gradient(var(--dot) 0.7px, transparent 0.8px);
    background-size:11.34px 11.34px;      /* a true 3mm dot grid */
    background-position:8px 8px;

<div class="chrome">
  <div>
    <h1 id="chrome-title">Monthly Roundup</h1>

<script>
(function(){
  "use strict";
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const num = n => Number(n || 0).toLocaleString("en-US");

  /* ---- derived reading numbers: computed here, never hand-entered ---- */
  const books      = (DATA.reading && DATA.reading.books) || [];
  const nBooks     = books.length;
  const totalPages = books.reduce((s,b) => s + (Number(b.pages) || 0), 0);
  const avg = (key) => {
    const v = books.map(b => Number(b[key])).filter(n => !isNaN(n) && n > 0);
    return v.length ? v.reduce((a,b) => a+b, 0) / v.length : 0;
  };
  const avgGR   = avg("goodreads");
  const avgMine = avg("mine");

  /* ---- small hand-drawn parts ---- */
  const STAR = "6,1 7.29,4.42 10.95,4.59 8.09,6.88 9.06,10.41 6,8.4 2.94,10.41 3.91,6.88 1.05,4.59 4.71,4.42";
  let uid = 0;
  function stars(rating, color, drawW){
    const id = "clip" + (++uid);
    const w  = Math.max(0, Math.min(5, rating)) / 5 * 62;
    const row = [0,1,2,3,4].map(i =>
      `<polygon points="${STAR}" transform="translate(${i*12.5},0)"/>`).join("");
    const dw = drawW || 62;
    return `<svg viewBox="0 0 62 12" width="${dw}" height="${(dw / 62 * 12).toFixed(1)}" role="img" aria-label="${rating.toFixed(2)} of 5">
      <defs><clipPath id="${id}"><rect x="0" y="0" width="${w.toFixed(2)}" height="12"/></clipPath>
      <g id="g${id}">${row}</g></defs>
      <use href="#g${id}" fill="none" stroke="${color}" stroke-width="0.9" opacity="0.55"/>
      <use href="#g${id}" fill="${color}" clip-path="url(#${id})"/>
    </svg>`;
  }
  /* a shelf of spines, one per book, height tracking its page count */
  /* one palette, shared by the spine drawing and the shelf list below it, so a
     book's chip and its spine are always the same colour */
  const PAL = ["var(--cat1)","var(--cat2)","var(--cat3)",
               "var(--cat4)","var(--cat5)","var(--cat6)"];
  function spines(list){
    const pal = PAL;
    const maxP = Math.max(120, ...list.map(b => Number(b.pages) || 0));
    const W = 8, G = 2.6, H = 36;
    const w = Math.max(W, list.length * (W+G) - G);
    const body = list.map((b,i) => {
      const h = 17 + Math.round((Math.min(maxP, Number(b.pages)||0) / maxP) * 17);
      const x = i * (W+G), y = H - h, c = pal[i % pal.length];
      return `<g><rect x="${x}" y="${y}" width="${W}" height="${h}" rx="1" fill="${c}" opacity="0.9"/>
        <rect x="${x+1.6}" y="${y+3.2}" width="${W-3.2}" height="0.9" fill="var(--paper)" opacity="0.75"/>
        <rect x="${x+1.6}" y="${y+5.6}" width="${W-3.2}" height="0.9" fill="var(--paper)" opacity="0.55"/>
        <rect x="${x+1.6}" y="${y+h-4}" width="${W-3.2}" height="0.9" fill="var(--paper)" opacity="0.6"/></g>`;
    }).join("");
    return `<svg class="spines" viewBox="0 0 ${w} ${H}" width="${w}" height="${H}" aria-hidden="true">
      ${body}<line x1="0" y1="${H-0.4}" x2="${w}" y2="${H-0.4}" stroke="var(--ink)" stroke-width="0.9"/></svg>`;
  }
  /* One bar per day of the month. A day with no reading is drawn as a stub on
     the baseline rather than skipped or interpolated — a gap in the export is
     worth seeing. */
  function stepsChart(series, avg, w, h, marksIn){
    const marks = Array.isArray(marksIn) ? marksIn : (marksIn ? [marksIn] : []);
    const n = series.length, gap = 2;
    const bw = Math.max(2.5, (w - gap * (n - 1)) / n);
    const vals = series.filter(v => v != null);
    if (!vals.length) return "";
    const top = Math.max.apply(null, vals);
    const lane = marks.length ? 11 : 0;          // headroom for the ring labels
    const plot = h - 7;
    let bars = "";
    series.forEach((v, i) => {
      const x = i * (bw + gap);
      if (v == null){
        bars += `<rect x="${x.toFixed(1)}" y="${plot - 1.5}" width="${bw.toFixed(1)}"
          height="1.5" fill="var(--ink-faint)" opacity=".4"><title>Day ${i+1}: no reading</title></rect>`;
        return;
      }
      const bh = Math.max(1.2, (v / top) * (plot - lane));
      bars += `<rect x="${x.toFixed(1)}" y="${(plot - bh).toFixed(1)}" width="${bw.toFixed(1)}"
        height="${bh.toFixed(1)}" rx="1.4" fill="var(--teal)"
        ><title>Day ${i+1}: ${num(v)} steps</title></rect>`;
    });
    const ay = plot - (avg / top) * (plot - lane);

    /* rings drawn round runs of days, the way you would circle them by hand.
       The label goes on whichever side of the ring has room. */
    let ring = "";
    marks.forEach(mk => {
      const a = Math.max(1, Number(mk.from)) - 1, b = Math.min(n, Number(mk.to)) - 1;
      const x0 = a * (bw + gap) - 2.5, x1 = b * (bw + gap) + bw + 2.5;
      const cx = (x0 + x1) / 2, rx = (x1 - x0) / 2, cy = plot - (plot - lane) / 2 + 1;
      const ry = (plot - lane) / 2 + 4;
      const col = mk.color || "var(--clay)";
      const left = cx < w / 2;                       // ring near the start → label to its right
      const lx = left ? x1 + 4 : x0 - 4;
      const tie = left ? x1 + 3 : x0 - 3;
      ring += `<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${rx.toFixed(1)}"
          ry="${ry.toFixed(1)}" fill="none" stroke="${col}" stroke-width="1.1"
          transform="rotate(-4 ${cx.toFixed(1)} ${cy.toFixed(1)})" opacity=".95"/>
        <text class="axm" x="${lx.toFixed(1)}" y="6.5" style="fill:${col}"
          text-anchor="${left ? "start" : "end"}">${esc(mk.label || "")}</text>
        <path d="M${tie.toFixed(1)} 8 Q ${(cx + (left ? rx * 0.4 : -rx * 0.4)).toFixed(1)} 9.5 ${(cx + (left ? rx * 0.55 : -rx * 0.55)).toFixed(1)} ${(cy - ry + 1).toFixed(1)}"
          fill="none" stroke="${col}" stroke-width=".7" opacity=".8"/>`;
    });

    return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img"
       aria-label="Daily steps across the month, averaging ${num(Math.round(avg))}${
         marks.map(mk => `; days ${mk.from} to ${mk.to} ringed: ${esc(mk.label || "")}`).join("")}">
      ${bars}
      <line x1="0" y1="${ay.toFixed(1)}" x2="${w}" y2="${ay.toFixed(1)}"
            stroke="var(--marigold)" stroke-width="1" stroke-dasharray="3 2.5"/>
      <line x1="0" y1="${plot}" x2="${w}" y2="${plot}" stroke="var(--ink)"
            stroke-width=".8" opacity=".55"/>
      ${ring}
      <text class="axn" x="0" y="${h - 0.5}">1</text>
      <text class="axn" x="${w}" y="${h - 0.5}" text-anchor="end">${n}</text>
    </svg>`;
  }

  /* Mean sleep for each weekday. One hue throughout — the six-hour rule is the
     reference line, and the numbers live in the note underneath, so nothing is
     encoded by colour alone. */
  /* Each weekday gets the shape of its usual night — a box over two years of
     data, where there are ~50 nights to take quartiles from — with this
     month's four or five nights scattered on top. A box drawn from one month
     alone would be quartiles of four points, which is mostly noise. */
  function median(arr){
    if (!arr || !arr.length) return 0;
    const a = arr.slice().sort((x, y) => x - y), m = a.length >> 1;
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }
  function weekdayChart(days, base, w, h, notes){
    const every = [];
    days.forEach(d => (d.values || []).forEach(v => every.push(v)));
    (base || []).forEach(b => { if (b.box) every.push(b.box.lo, b.box.hi); });
    if (!every.length) return "";
    // Scale to the baseline's own reach. One 13-hour night would otherwise
    // stretch the axis until every other weekday collapsed into a smudge;
    // anything above the top is pinned there and drawn as a caret instead.
    const reach = [];
    (base || []).forEach(b => { if (b.box) reach.push(b.box.lo, b.box.hi); });
    const lo = Math.floor(Math.min.apply(null, every) * 2) / 2 - 0.3;
    const hi = Math.ceil(Math.max(reach.length ? Math.max.apply(null, reach) : 10, 9) * 2) / 2 + 0.3;
    const top = 3, plot = h - 8;                 // 8px lane for the day letters
    const step = w / days.length;
    const Y = v => top + (1 - (v - lo) / (hi - lo)) * (plot - top);
    const BW = Math.min(14, step * 0.52);
    const JIT = [0, -0.34, 0.34, -0.62, 0.62, -0.17, 0.17];   // stable, not random

    let boxes = "", dots = "", labs = "", means = "";
    const named = {};
    const meanPts = [];
    days.forEach((d, i) => {
      const cx = step * (i + 0.5);
      const b = (base && base[i] && base[i].box) || null;
      if (b){
        boxes += `<line x1="${cx}" y1="${Y(b.hi).toFixed(1)}" x2="${cx}" y2="${Y(b.lo).toFixed(1)}"
            stroke="var(--ink-faint)" stroke-width=".7" opacity=".75"/>
          <rect x="${(cx - BW / 2).toFixed(1)}" y="${Y(b.q3).toFixed(1)}" width="${BW.toFixed(1)}"
            height="${Math.max(1, Y(b.q1) - Y(b.q3)).toFixed(1)}" rx="1.2"
            fill="var(--ink-faint)" fill-opacity=".2" stroke="var(--ink-faint)" stroke-width=".7"
            ><title>${esc(d.day)} over 2 years: middle half ${b.q1}–${b.q3} h, median ${b.med} h</title></rect>
          <line x1="${(cx - BW / 2).toFixed(1)}" y1="${Y(b.med).toFixed(1)}"
            x2="${(cx + BW / 2).toFixed(1)}" y2="${Y(b.med).toFixed(1)}"
            stroke="var(--ink-soft)" stroke-width="1.1"/>`;
      }
      (d.values || []).forEach((v, k) => {
        const x = cx + (JIT[k % JIT.length]) * BW;
        if (v > hi){
          dots += `<path d="M${(x - 2.4).toFixed(1)} ${(Y(hi) + 4.4).toFixed(1)}
            L${x.toFixed(1)} ${(Y(hi) + 1).toFixed(1)} L${(x + 2.4).toFixed(1)} ${(Y(hi) + 4.4).toFixed(1)}Z"
            fill="var(--teal)" stroke="var(--paper)" stroke-width=".7"
            ><title>${esc(d.day)} this month: ${v} h — above the top of the scale</title></path>`;
          const nt = (notes || []).filter(z => z && z.day === d.day)[0];
          if (nt && !named[d.day]){
            named[d.day] = true;
            const toRight = x < w / 2;
            dots += `<text class="axm" x="${(x + (toRight ? 4.5 : -4.5)).toFixed(1)}"
              y="${(Y(hi) + 5.4).toFixed(1)}" text-anchor="${toRight ? "start" : "end"}"
              style="fill:${nt.color || "var(--teal)"}">${esc(nt.label)}</text>`;
          }
        } else {
          dots += `<circle cx="${x.toFixed(1)}" cy="${Y(v).toFixed(1)}" r="1.7" fill="var(--teal)"
            fill-opacity=".45"><title>${esc(d.day)} this month: ${v} h</title></circle>`;
        }
      });
      // The line joins medians, not means. A single 13h38 night (Yom Kippur,
      // 21 Sept) dragged Monday's mean to 7.98 against a 6.47 median — the
      // mean was describing the holiday, not the Mondays.
      const m = median(d.values);
      if (m > 0){
        const my = Y(Math.min(m, hi));
        meanPts.push([cx, my]);
        means += `<circle cx="${cx.toFixed(1)}" cy="${my.toFixed(1)}" r="2.6" fill="var(--teal)"
          stroke="var(--paper)" stroke-width="1.1"
          ><title>${esc(d.day)} median this month: ${m.toFixed(2)} h</title></circle>`;
      }
      labs += `<text class="axd" x="${cx.toFixed(1)}" y="${h - 0.5}" text-anchor="middle"
        >${esc(String(d.day).charAt(0))}</text>`;
    });
    const meanPath = meanPts.map((pt, i) => (i ? "L" : "M") + pt[0].toFixed(1) + " " + pt[1].toFixed(1)).join(" ");
    const six = Y(6);
    return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img"
       aria-label="Hours slept by weekday: each night this month as a dot with the median joined up, over a box of the usual range across two years">
      <line x1="0" y1="${six.toFixed(1)}" x2="${w - 13}" y2="${six.toFixed(1)}"
            stroke="var(--marigold)" stroke-width="1" stroke-dasharray="3 2.5"/>
      <text class="axn" x="${w}" y="${(six + 2).toFixed(1)}" text-anchor="end">6h</text>
      ${boxes}${dots}
      <path d="${meanPath}" fill="none" stroke="var(--teal)" stroke-width="1.6"
            stroke-linejoin="round" stroke-linecap="round"/>
      ${means}${labs}
    </svg>`;
  }

  /* a walked trail with a bootprint at the end */
  const trail = `<svg viewBox="0 0 96 18" width="96" height="18" aria-hidden="true" fill="none">
      <path d="M1,13 C14,3 26,17 39,9 C52,1 62,15 74,9" stroke="var(--ink-faint)"
            stroke-width="1.1" stroke-linecap="round" stroke-dasharray="1.5 3.6"/>
      <g fill="var(--teal)" opacity="0.85">
        <ellipse cx="82" cy="8.4" rx="2.5" ry="4.2" transform="rotate(14 82 8.4)"/>
        <ellipse cx="88.5" cy="12" rx="2.5" ry="4.2" transform="rotate(14 88.5 12)"/>
      </g></svg>`;

  const ICON = {
    book:`<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="var(--teal)"
      stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4.2C6.6 3 4.6 2.6 2.4 2.8v9.4c2.2-.2 4.2.2 5.6 1.4 1.4-1.2 3.4-1.6 5.6-1.4V2.8C11.4 2.6 9.4 3 8 4.2z"/><path d="M8 4.2v9.4"/></svg>`,
    shoe:`<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="var(--teal)"
      stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 11.6V5.2l2.6.8 1.6 2 3 .9 4.4 1.5c.9.3 1.2 1.2.5 1.7-.5.4-1.3.5-2 .5H3.2c-.7 0-1.2-.4-1.2-1z"/><path d="M4.6 6 6 4.4"/></svg>`,
    house:`<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="var(--teal)"
      stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 7.4 8 2.6l5.8 4.8"/><path d="M3.6 8.5v4.9h8.8V8.5"/><path d="M6.6 13.4v-3.2h2.8v3.2"/></svg>`,
    case:`<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="var(--teal)"
      stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5.2" width="12" height="8.2" rx="1.2"/><path d="M6 5.2V3.9c0-.5.4-.9.9-.9h2.2c.5 0 .9.4.9.9v1.3"/><path d="M2 8.8h12"/></svg>`,
    star:`<svg viewBox="0 0 14 14" width="12" height="12" aria-hidden="true"><polygon points="7,1.2 8.6,5.1 12.8,5.4 9.6,8.1 10.6,12.2 7,9.9 3.4,12.2 4.4,8.1 1.2,5.4 5.4,5.1" fill="var(--clay)" opacity="0.9"/></svg>`,
    cake:`<svg viewBox="0 0 14 14" width="12.5" height="12.5" aria-hidden="true">
      <ellipse cx="7" cy="1.9" rx="1" ry="1.4" fill="var(--marigold)"/>
      <rect x="6.6" y="3.2" width=".9" height="2.1" fill="var(--ink-faint)"/>
      <path d="M2.3 7.6 Q7 5.6 11.7 7.6 L11.7 11.5 Q7 12.4 2.3 11.5Z" fill="var(--clay)" opacity=".92"/>
      <path d="M2.3 7.6 Q7 5.6 11.7 7.6" fill="none" stroke="var(--paper)" stroke-width=".9"/>
    </svg>`
  };
  function photo(src, caption, alt){
    const inner = src
      ? `<img class="frame" src="${esc(src)}" alt="${esc(alt)}">`
      : `<div class="noshot" role="img" aria-label="no photo"><svg viewBox="0 0 24 24" width="19" height="19"
           fill="none" stroke="var(--ink-faint)" stroke-width="1.3" stroke-linecap="round"
           stroke-linejoin="round"><path d="M3 8.5h3.4L8 6.3h8l1.6 2.2H21v10H3z"/><circle cx="12" cy="13.2" r="3.1"/></svg></div>`;
    return `<figure class="polaroid">${inner}<figcaption>${esc(caption || "")}</figcaption></figure>`;
  }

  /* ---- compose the page ---- */
  const r = DATA.reading || {}, h = DATA.health || {},
        f = DATA.family  || {}, w = DATA.work   || {};
  const days   = Number(DATA.daysInMonth) || 30;
  const nights = Math.max(0, Math.min(days, Number(h.nightsOver6) || 0));

  /* crescent, for the line that says what the sleep chart means */
  const MOON = `<svg viewBox="0 0 12 12" width="8.5" height="8.5" aria-hidden="true">
      <path d="M9.3 7.9A4.2 4.2 0 0 1 4.1 2.2a4.4 4.4 0 1 0 5.2 5.7z"
            fill="var(--marigold)" stroke="var(--ink)" stroke-width=".6"
            stroke-linejoin="round"/></svg>`;

  /* the shelf, best-rated first, each chip keyed to that book's spine colour */
  const score = v => Number.isInteger(v) ? String(v) : Number(v).toFixed(2).replace(/0$/, "");
  const shelfRows = books
    .map((b, i) => ({ title: b.title, mine: Number(b.mine) || 0, color: PAL[i % PAL.length] }))
    .filter(b => b.title)
    .sort((a, b) => b.mine - a.mine)
    .map(b => `<div class="srow"><i style="background:${b.color}"></i>
      <span class="st">${esc(b.title)}</span>
      <span class="ss">${b.mine > 0 ? score(b.mine) : "&ndash;"}</span></div>`)
    .join("");

  /* weather is optional: no data, no band. Each month names its own figures,
     since what's worth reporting differs — a dry month and a cold one are not
     interesting for the same reasons. */
  const wx = DATA.weather;
  const BOLT = `<svg viewBox="0 0 12 16" width="8.5" height="11.5" aria-hidden="true">
      <path d="M7.6 0.9 2.3 9.1h3.1l-1 6 5.4-8.7H6.7z" fill="var(--marigold)"
            stroke="var(--ink)" stroke-width=".7" stroke-linejoin="round"/></svg>`;
  const weatherBand = !(wx && wx.items && wx.items.length) ? "" : `
    <div class="weather">
      <div class="wrow">
        <span class="wlab">${esc(wx.place || "Weather")}</span>
        ${wx.items.map(it => `<span class="witem"><b class="${
          it.tone === "warm" ? "warm" : it.tone === "wet" ? "wet" : ""
        }">${esc(it.value)}</b> ${esc(it.label)}</span>`).join("")}
      </div>
      ${wx.note ? `<div class="wnote">${BOLT}<span>${esc(wx.note)}</span></div>` : ""}
    </div>`;

  /* Carryover may be one task or several, typed on separate lines. Each
     migrating task gets its own ">" — that is what the mark means. */
  const carried = Array.isArray(w.carryover) ? w.carryover.slice()
    : String(w.carryover || "").split(/\r?\n+/);
  const carriedClean = carried.map(c => String(c).trim()).filter(Boolean);

  /* Photos are a strip now rather than two captioned frames: overlapping,
     each tipped a little, the way a handful of prints falls on a page. */
  const shotList = (Array.isArray(f.photos) ? f.photos
    /* months built before the strip kept two named photos */
    : [f.lilahPhoto, f.activityPhoto]).filter(x => x && x.src);
  const TILT = [-2.4, 1.8, -1.2, 2.6, -1.9, 1.1];
  const shots = shotList.length
    ? shotList.map((ph, i) => `<figure class="snap" style="transform:rotate(${TILT[i % TILT.length]}deg);z-index:${i + 1}">
        <img src="${esc(ph.src)}" alt="${esc(ph.alt || "A photo from this month")}">
      </figure>`).join("")
    : `<div class="noshot" role="img" aria-label="no photos"><svg viewBox="0 0 24 24" width="19"
         height="19" fill="none" stroke="var(--ink-faint)" stroke-width="1.3" stroke-linecap="round"
         stroke-linejoin="round"><path d="M3 8.5h3.4L8 6.3h8l1.6 2.2H21v10H3z"/><circle cx="12" cy="13.2" r="3.1"/></svg></div>`;

  /* a month can have more than one thing worth celebrating */
  const celebrations = (Array.isArray(f.celebration) ? f.celebration
    : String(f.celebration || "").split(/\r?\n+/)).map(t => String(t).trim()).filter(Boolean);

  const highlights = (Array.isArray(f.highlights) ? f.highlights
    : String(f.highlights || "").split(/\r?\n+/)).map(t => String(t).trim()).filter(Boolean);

  /* A theme is decoration only: everything it draws is absolutely positioned
     in the page margins, so turning it on never pushes content around. */
  const birthday = DATA.theme === "birthday";
  const moShort = String(DATA.month || "").slice(0, 3);

  function bunting(w, h){
    const n = 12, sag = 3.4, fw = 8.4, fh = 7;
    const yAt = t => (1 - t) * (1 - t) * 1 + 2 * (1 - t) * t * (1 + 2 * sag) + t * t * 1;
    let flags = "";
    for (let i = 0; i < n; i++){
      const t = (i + 0.5) / n, x = t * w, y = yAt(t);
      flags += `<path d="M${(x - fw / 2).toFixed(1)} ${y.toFixed(1)}
        L${(x + fw / 2).toFixed(1)} ${y.toFixed(1)} L${x.toFixed(1)} ${(y + fh).toFixed(1)}Z"
        fill="${PAL[i % PAL.length]}" opacity=".88"/>`;
    }
    return `<svg class="deco bunting" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">
      <path d="M0 1 Q ${w / 2} ${(1 + 2 * sag).toFixed(1)} ${w} 1" fill="none"
            stroke="var(--ink)" stroke-width=".8" opacity=".65"/>${flags}</svg>`;
  }

  /* scattered in the side and foot margins only — never over the content */
  function confetti(){
    const marks = [
      [10, 92, 18], [14, 212, -24], [8, 330, 40], [15, 452, -12], [9, 556, 28],
      [466, 120, -30], [461, 238, 16], [469, 352, -18], [462, 470, 34], [468, 588, -8],
      [120, 659, 22], [240, 663, -14], [360, 658, 30], [44, 661, -26], [430, 655, 12],
    ];
    const bits = marks.map((m, i) => {
      const [x, y, rot] = m, c = PAL[i % PAL.length];
      if (i % 3 === 0)
        return `<circle cx="${x}" cy="${y}" r="1.7" fill="${c}" opacity=".55"/>`;
      if (i % 3 === 1)
        return `<rect x="${x - 1.8}" y="${y - 3}" width="3.6" height="5.4" rx=".8" fill="${c}"
          opacity=".5" transform="rotate(${rot} ${x} ${y})"/>`;
      return `<path d="M${x - 3} ${y} q3 -3.4 6 0" fill="none" stroke="${c}" stroke-width="1.1"
        opacity=".55" stroke-linecap="round" transform="rotate(${rot} ${x} ${y})"/>`;
    }).join("");
    return `<svg class="deco confetti" viewBox="0 0 480 672" width="480" height="672"
      aria-hidden="true">${bits}</svg>`;
  }

  const head = (icon, name) =>
    `<div class="sec-head">${icon}<span class="name">${name}</span><span class="rule"></span></div>`;

  document.getElementById("page").innerHTML = `
    ${DATA.sample ? `<div class="sample-note">sample month — yours will be real</div>` : ""}

    ${birthday ? bunting(428, 12) + confetti() : ""}

    <div class="masthead">
      <div class="hair"></div>
      <h1 class="title">${esc(DATA.month)} ${esc(DATA.year)} Roundup</h1>
      <div class="dbl"></div>
    </div>

    <section class="sec">
      ${head(ICON.book, "Reading")}
      <div class="read-body${r.sticky ? "" : " nonote"}">
        <div class="read-left">
          <div class="read-top">
            ${spines(books)}
            <span class="stat"><span class="n">${nBooks}</span><span class="u">${nBooks === 1 ? "book" : "books"}</span></span>
            <span class="stat"><span class="n alt">${num(totalPages)}</span><span class="u">pages</span></span>
          </div>
          <div class="scores">
            <span class="score"><span class="who">Mine</span>${stars(avgMine,"var(--marigold)",54)}<span class="val" style="color:var(--marigold)">${avgMine.toFixed(2)}</span></span>
            <span class="score"><span class="who">Goodreads</span>${stars(avgGR,"var(--ink-soft)",54)}<span class="val" style="color:var(--ink-soft)">${avgGR.toFixed(2)}</span></span>
          </div>
          <div class="picks">
            <div class="pick"><span class="mk" style="color:var(--clay)">&#9829;</span>
              <span><b>${esc((r.favorite||{}).title)}</b>${(r.favorite||{}).note ? ` &mdash; <i>${esc(r.favorite.note)}</i>` : ""}</span></div>
            <div class="pick"><span class="mk" style="color:var(--ink-faint)">&times;</span>
              <span><b>${esc((r.leastFavorite||{}).title)}</b>${(r.leastFavorite||{}).note ? ` &mdash; <i>${esc(r.leastFavorite.note)}</i>` : ""}</span></div>
          </div>
        </div>
        ${r.sticky ? `<div class="sticky">${esc(r.sticky)}</div>` : ""}
      </div>
      ${(r.quote && r.quote.text) ? `<blockquote class="quote">&ldquo;${esc(r.quote.text)}&rdquo;
        <cite>${esc(r.quote.book)}</cite></blockquote>` : ""}
    </section>

    <section class="sec">
      ${head(ICON.shoe, "Health")}
      ${(h.stepSeries && h.stepSeries.length) ? `
      <div class="charts">
        <figure class="ch">
          <div class="steps-row">
            <span class="n">${num(h.steps)}</span><span class="u">steps</span>
            <span class="equiv">&#8776; ${esc(h.stepsEquivalent)}</span>
          </div>
          <figcaption>Steps by day<em>avg ${num(Math.round(h.stepMean || 0))}</em></figcaption>
          ${stepsChart(h.stepSeries, Number(h.stepMean) || 0, 195, 46, h.marks || h.mark)}
        </figure>
        <figure class="ch">
          <figcaption>Sleep by weekday<em>${esc(moShort)} nights &amp; median &middot; box = usual</em></figcaption>
          ${weekdayChart(h.weekday || [], h.weekdayBase || [], 220, 78, h.sleepNotes)}
        </figure>
      </div>` : ""}

      <div class="hstats">
        <span><b>${num(h.hoursSlept)}</b> hrs slept</span>
        <span><b>${nights}</b> of ${num(h.nightsRecorded || days)} nights over 6h</span>
        <span><b>${num(h.gymWorkouts)}</b> workouts</span>
      </div>
      ${h.note ? `<div class="hnote">${MOON}<span>${esc(h.note)}</span></div>` : ""}
    </section>

    ${weatherBand}

    <section class="sec">
      ${head(ICON.house, "Family")}
      <div class="photostrip">${shots}</div>
    </section>

    <div class="bottom">
      <section class="sec col">
        <div class="fline"><span class="lab">New this month</span>${esc(f.lilahSkill)}</div>
        ${highlights.length ? `<div class="hilites"><span class="lab">Highlights</span>
          ${highlights.map((t, i) => `<div class="hl"><span class="hn">${i + 1}</span>
            <span>${esc(t)}</span></div>`).join("")}</div>` : ""}
        ${celebrations.length ? `<div class="celebrate">${birthday ? ICON.cake : ICON.star}<span class="txt"
          >${celebrations.map((c, i) => `${i ? `<i class="sep">&middot;</i>` : ""}<span>${esc(c)}</span>`).join("")}</span></div>` : ""}
      </section>

      <section class="sec col">
        ${head(ICON.case, "Work")}
        <div class="wentry"><span class="bullet" style="color:var(--teal)">&times;</span>
          <span class="body"><span class="lab">Landed it</span>${esc(w.accomplishment)}</span></div>
        ${carriedClean.length ? `<div class="carries">
          <span class="lab">Migrates forward</span>
          ${carriedClean.map(c => `<div class="wentry"><span class="bullet"
            style="color:var(--clay)">&gt;</span><span class="body">${esc(c)}</span></div>`).join("")}
        </div>` : ""}
      </section>
    </div>

    ${(shelfRows && books.length >= 3) ? `<div class="shelf">
      <span class="shelf-head">The shelf</span>${shelfRows}</div>` : ""}

    <div class="foot">
      <span><b>&times;</b> done &nbsp;&nbsp; <b>&gt;</b> carried to next month</span>
      <span class="stamp">${esc(DATA.month)} ${esc(DATA.year)}</span>
    </div>
  `;

  /* Give the photos exactly the height the rest of the page leaves over, as a
     pixel value, instead of letting flex distribute the slack. Chromium's PDF
     layout resolves flex differently from its screen layout, so a page that
     measured clean in the browser could still clip when printed. Measuring
     once here and pinning the result makes both paths agree. */
  /* Step the celebration down until it sits on one line. A fixed size can't
     promise that: the text is whatever the month had to celebrate. */
  function fitCelebration(){
    const txt = document.querySelector(".celebrate .txt");
    if (!txt || txt.children.length < 2) return;
    const oneLine = () => {
      const top = txt.children[0].getBoundingClientRect().top;
      for (const k of txt.children)
        if (Math.abs(k.getBoundingClientRect().top - top) > 0.6) return false;
      return true;
    };
    for (const size of [11, 10.5, 10, 9.5, 9, 8.5]){
      txt.style.fontSize = size + "px";
      if (oneLine()) return;
    }
    txt.style.fontSize = "";      // too much to celebrate — let it wrap
  }

  function sizePhotos(){
    const pageEl = document.getElementById("page");
    const strip = pageEl.querySelector(".photostrip");
    if (!strip) return;
    const foot = pageEl.querySelector(".foot");

    // The page has a fixed height, so scrollHeight never drops below
    // clientHeight and cannot reveal the slack; and the footer's
    // margin-top:auto swallows it. Stand the margin down and read the free
    // space off the footer's own position instead.
    if (foot) foot.style.marginTop = "0px";
    strip.style.overflow = "hidden";
    strip.style.height = "0px";

    const padBottom = parseFloat(getComputedStyle(pageEl).paddingBottom) || 0;
    const usable = pageEl.clientHeight - padBottom;
    const bottomOf = () => foot ? foot.offsetTop + foot.offsetHeight : usable;

    strip.style.height = Math.max(70, Math.min(150, (usable - bottomOf()) - 2)) + "px";
    const over = bottomOf() - usable;
    if (over > 0) strip.style.height = Math.max(54, strip.offsetHeight - over) + "px";

    strip.style.overflow = "";
    if (foot) foot.style.marginTop = "";
  }
  /* Once now so the first paint is sane, and again when the webfonts land:
     measuring against fallback metrics pins the wrong height, and the text
     reflows under it. */
  function layout(){ fitCelebration(); sizePhotos(); }
  layout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

  const title = `${DATA.month} ${DATA.year} Roundup`;
  document.title = title;
  document.getElementById("chrome-title").textContent = title;

  /* fit the fixed 5x7 page to whatever is looking at it */
  const stage = document.getElementById("stage"), wrap = document.getElementById("stage-wrap");
  function fit(){
    const s = Math.max(0.42, Math.min(1.5, (wrap.clientWidth) / 480));
    stage.style.transform = "scale(" + s + ")";
    wrap.style.height = Math.ceil(672 * s) + "px";
  }
  fit();
  addEventListener("resize", fit);
  document.getElementById("print-btn").addEventListener("click", () => window.print());
})();
</script>
